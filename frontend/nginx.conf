resolver 127.0.0.11 valid=10s ipv6=off;
upstream istay_api {
    zone istay_api 64k;
    server api:8000 resolve;
}
map $uri $istay_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 256k;
    access_log off;
    add_header Cache-Control $istay_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://speed.cloudflare.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        proxy_pass http://istay_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
    }
    location = /sw.js { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
