[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "istay-telco-audit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.4,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2.6,<4", "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23.1,<26", "openpyxl>=3.1.5,<4"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "pyyaml>=6,<7", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
