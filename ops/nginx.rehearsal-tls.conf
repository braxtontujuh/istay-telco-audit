server {
    listen 8443 ssl;
    server_name localhost;
    server_tokens off;
    ssl_certificate /etc/nginx/rehearsal-tls/server.crt;
    ssl_certificate_key /etc/nginx/rehearsal-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
    }
}
